{% extends "base.html" %}
{% block title %}Sign up — Placifier{% endblock %}

{% block content %}
<div class="page-sm">
    <div class="auth-header">
        <h1>Create your account</h1>
        <p>Get matched with jobs that fit your skills</p>
    </div>

    <div class="card">
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/signup" method="post">
            <div class="form-group">
                <label for="name">Full name</label>
                <input id="name" type="text" name="name" value="{{ name or '' }}"
                       placeholder="e.g. Hemayoun Hussain" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" value="{{ email or '' }}"
                       placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password"
                       placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign up</button>
        </form>
    </div>

    <div class="auth-footer">
        Already have an account? <a href="/login">Log in</a>
    </div>
</div>
{% endblock %}
