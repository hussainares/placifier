{% extends "base.html" %}
{% block title %}Log in — Placifier{% endblock %}

{% block content %}
<div class="page-sm">
    <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Log in to your Placifier account</p>
    </div>

    <div class="card">
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" value="{{ email or '' }}"
                       placeholder="you@example.com" autocomplete="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password"
                       placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>
    </div>

    <div class="auth-footer">
        New to Placifier? <a href="/signup">Create an account</a>
    </div>
</div>
{% endblock %}
