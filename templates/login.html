<!DOCTYPE html>
<html>
<head>
    <script>(function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
    <title>Login — Placement System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <a class="nav-brand" href="/"><span>Placement</span> System</a>
    <div class="nav-links">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="icon-light">&#127769;</span><span class="icon-dark">&#9728;&#65039;</span></button>
    </div>
</nav>

<div class="page-sm">
    <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Login to access the placement system</p>
    </div>

    <div class="card">
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
        </form>
    </div>

    <div class="auth-footer">
        Don't have an account? <a href="/signup">Sign up</a>
    </div>
</div>

<script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</body>
</html>
